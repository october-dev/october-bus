name: Publish npm prerelease

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-prerelease
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.x
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:errors
      - run: go build -o /tmp/october-bus ./cmd/october-bus
        working-directory: .
      - run: npm run test:integration
        env:
          OCTOBER_BUS_BINARY: /tmp/october-bus
      - name: Verify prerelease version
        run: node -e "if (!require('./package.json').version.includes('-')) throw new Error('npm prerelease version required')"
      - run: npm publish --provenance --access public --tag next
