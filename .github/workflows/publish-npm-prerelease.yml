name: Publish npm prerelease

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-prerelease
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.x
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Verify reviewed release commit
        run: node scripts/release-policy.mjs
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
      - run: go test -race -count=1 ./...
        working-directory: .
      - run: go vet ./...
        working-directory: .
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:errors
      - run: npm run test:release
      - run: npm run build:native -- --all
      - run: npm run test:integration
        env:
          OCTOBER_BUS_BINARY: ${{ github.workspace }}/dist/npm/linux-x64/bin/october-bus
      - run: npm run pack:distribution -- --all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-distribution
          path: dist/npm/*.tgz*
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-distribution
          path: dist/npm
      - run: npm run test:distribution
        working-directory: sdk/typescript

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-distribution
          path: dist/npm
      - name: Publish native packages first, then CLI and SDK
        run: npm run publish:distribution
        working-directory: sdk/typescript
