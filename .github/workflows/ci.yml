name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          cache: true
      - run: go test ./...
      - if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./cmd/october-bus
      - run: go build ./cmd/october-bus-conformance
      - run: go run ./cmd/october-bus demo
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: sdk/typescript
      - run: npm run build:native
        working-directory: sdk/typescript
      - run: npm run pack:distribution
        working-directory: sdk/typescript
      - run: npm run test:distribution
        working-directory: sdk/typescript

  npm-platforms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run build:native -- --all
        working-directory: sdk/typescript

  typescript-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:errors
      - run: node --test ../../scripts/release-policy.test.mjs ../../scripts/publish-npm.test.mjs
      - run: npm audit --audit-level=high

  interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: go build -o /tmp/october-bus ./cmd/october-bus
      - run: npm ci
        working-directory: sdk/typescript
      - run: npm run build
        working-directory: sdk/typescript
      - run: npm run test:integration
        working-directory: sdk/typescript
        env:
          OCTOBER_BUS_BINARY: /tmp/october-bus

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: 1.27.x
          go-package: ./...
